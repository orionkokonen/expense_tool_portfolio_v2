# ローカルで行う確認を、GitHub 上でも自動で繰り返す設定。
name: ci

# push（コミットを送ったとき）と pull_request（PR を出したとき）に自動で動く
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest  # GitHub が用意する Ubuntu 環境で実行する
    strategy:
      matrix:
        # Python 4 バージョンで同時にテストして互換性を確認する
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4          # リポジトリのコードを取得する
      - uses: actions/setup-python@v5      # 指定バージョンの Python をセットアップする
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip          # pip 自体を最新にする
      - run: pip install -r requirements-dev.txt          # 開発用ライブラリをインストールする
      - run: ruff check .                                  # 静的チェック（コードの書き方の問題を検出）
      - run: mypy .                                        # 型チェック（型の不整合を検出）
      - run: pytest -q                                     # テストを実行する
